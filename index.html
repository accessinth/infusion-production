<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>บันทึกงานอินฟิวชั่น</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Khmer:wght@400;600&family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: แอปแท็บเล็ตหน้างาน — แถบบนติดหัว, เนื้อหากว้างไม่เกิน 1280px, ใบงาน (job traveler) เลื่อนออกจากขวา */
:root{
  --bg:#ECF0F1; --surface:#FFFFFF; --surface-2:#F4F7F7; --line:#D2DBDD; --line-2:#B9C6C9;
  --ink:#122024; --ink-2:#42545A; --muted:#66777D;
  --accent:#0D6B71; --accent-ink:#FFFFFF; --accent-soft:#DDECEC; --accent-mid:#8CC2C4;
  --good:#2B7A4B; --warn:#995A00; --bad:#BD3528;
  --scrim:rgba(8,20,24,.46);
  --shadow:0 1px 2px rgba(10,30,34,.07),0 8px 22px rgba(10,30,34,.07);
  --f-display:'Bai Jamjuree','IBM Plex Sans Thai','Noto Sans Khmer','Noto Sans Myanmar',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun','Noto Sans Khmer','Noto Sans Myanmar',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1619; --surface:#152024; --surface-2:#1B282D; --line:#28383D; --line-2:#36494F;
  --ink:#E4EDEF; --ink-2:#A7B8BD; --muted:#82959B;
  --accent:#4DBDC1; --accent-ink:#06272A; --accent-soft:#183A3D; --accent-mid:#2F6E72;
  --good:#5BC28A; --warn:#E1A33F; --bad:#EE7A6D;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1619; --surface:#152024; --surface-2:#1B282D; --line:#28383D; --line-2:#36494F;
  --ink:#E4EDEF; --ink-2:#A7B8BD; --muted:#82959B;
  --accent:#4DBDC1; --accent-ink:#06272A; --accent-soft:#183A3D; --accent-mid:#2F6E72;
  --good:#5BC28A; --warn:#E1A33F; --bad:#EE7A6D;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.25;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:1.25rem} h3{font-size:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.eyebrow{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:500}

/* ---- top bar ---- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-co{font:600 .7rem/1 var(--f-mono);letter-spacing:.16em;color:var(--muted)}
.brand-dept{font:700 1.2rem/1.2 var(--f-display);margin-top:3px}
.tabs-wrap{flex:1 1 420px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:4px;width:max-content}
.tab{border:0;background:none;padding:10px 14px;border-radius:8px;font:600 .98rem var(--f-display);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;min-height:44px}
.tab:hover{background:var(--surface-2)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tab svg{width:14px;height:14px;opacity:.6}
.top-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.who{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border:1px solid var(--line);border-radius:999px;font-size:.88rem}
.who b{font-weight:600}

.banner{background:var(--accent-soft);color:var(--ink);font-size:.9rem}
.banner-in{max-width:1280px;margin:0 auto;display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

main{max-width:1280px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.section{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-head h2 .count{font:500 .95rem var(--f-body);color:var(--muted);margin-left:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---- buttons & chips ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn-xl{min-height:64px;font-size:1.15rem;padding:12px 28px;border-radius:12px;font-family:var(--f-display)}
.btn-sm{min-height:36px;padding:4px 12px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.3rem;line-height:1;color:var(--ink-2);flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.good{background:color-mix(in srgb,var(--good) 13%,var(--surface));color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,var(--surface))}
.chip.warn{background:color-mix(in srgb,var(--warn) 13%,var(--surface));color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--surface))}
.chip.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--surface))}
.chip.info{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,var(--surface))}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:48px;min-width:56px;padding:6px 16px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg.res button[data-v="pass"][aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.seg.res button[data-v="rework"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.seg.res button[data-v="scrap"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg.small button{min-height:40px;min-width:0;font-weight:500;font-size:.92rem}

/* ---- floor ---- */
.floor-head{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.scan{flex:1 1 320px;display:flex;gap:8px;min-width:0}
.scan input{flex:1;min-width:0;min-height:52px;border:1px solid var(--line-2);border-radius:10px;padding:0 14px;background:var(--surface);font-family:var(--f-mono);font-size:1.05rem}
.stepbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.stepbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-height:96px}
.stepbtn:hover{border-color:var(--line-2)}
.stepbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.stepbtn .no{font:700 1.6rem/1 var(--f-display);color:var(--accent)}
.stepbtn .nm{font-weight:600;font-size:.95rem;line-height:1.3}
.stepbtn .cnt{font-size:.8rem;color:var(--muted);margin-top:auto}
.stepbtn .cnt b{color:var(--ink);font-weight:600}
.stepbtn .rt{font-size:.72rem;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.pcard.working{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pc-top .mono{font-size:1.02rem}
.pc-prod{font-weight:600;font-size:1.02rem}
.pc-meta{font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
.pc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.86rem;padding-top:6px;border-top:1px dashed var(--line)}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:6px;border-radius:2px;background:var(--line)}
.pips i.d{background:var(--accent)}
.pips i.c{background:var(--accent-mid)}
.empty{padding:22px;border:1px dashed var(--line-2);border-radius:12px;color:var(--muted);text-align:center;background:var(--surface)}
.empty-act{padding:20px;border:1px dashed var(--line-2);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty-act p{margin:0;color:var(--ink-2)}
.empty-act p b{color:var(--ink);font-family:var(--f-display);font-size:1.1rem;font-weight:600}
.chip-btn{min-height:40px;padding:6px 14px;font-size:.9rem;cursor:pointer}
.chip-btn:hover{border-color:var(--accent);color:var(--accent)}
#queue{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 130px)}
@media (max-width:760px){
  .stepbar-wrap{overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin-bottom:-4px;padding-bottom:4px}
  .stepbar-wrap::-webkit-scrollbar{display:none}
  .stepbar{display:flex;gap:6px;width:max-content}
  .stepbtn{flex:0 0 124px;min-height:78px;padding:8px 10px;scroll-snap-align:start}
  .stepbtn .cnt{font-size:.74rem;white-space:nowrap}
  .stepbtn .no{font-size:1.3rem}
  .stepbtn .nm{font-size:.88rem}
  .stepbtn .rt{display:none}
}

/* ---- panels / tables ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.action{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--shadow)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-weight:600;font-size:.8rem;color:var(--muted);letter-spacing:.03em;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.wrap{white-space:normal;min-width:180px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:90px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.var-up{color:var(--bad);font-weight:600} .var-dn{color:var(--good);font-weight:600}

/* ---- KPI ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font:700 2rem/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .s{font-size:.84rem;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
@media (max-width:1180px){.dash-grid{grid-template-columns:minmax(0,1fr)}}

/* WIP bars */
.legend{display:flex;gap:14px;font-size:.84rem;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.wip{display:flex;flex-direction:column;gap:6px}
.wip-row{display:grid;grid-template-columns:minmax(110px,170px) 1fr 44px;gap:10px;align-items:center;font-size:.9rem;padding:3px 4px;border-radius:6px}
.wip-row:hover{background:var(--surface-2)}
.wip-track{display:flex;gap:2px;height:16px;min-width:0}
.wip-track span{display:block;height:100%}
.wip-track span:first-child{border-radius:4px 0 0 4px}
.wip-track span:last-child{border-radius:0 4px 4px 0}
.wip-track span:only-child{border-radius:4px}
.s-work{background:var(--accent)} .s-wait{background:var(--accent-mid)} .s-qc{background:var(--warn)}

/* ---- sheet & modal ---- */
.sheet{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end}
.sheet-backdrop{position:absolute;inset:0;background:var(--scrim)}
.sheet-panel{position:relative;width:min(780px,100%);height:100%;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));box-shadow:-10px 0 30px rgba(0,0,0,.18)}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head h2{font-size:1.35rem}
.sheet-head>.row{flex-wrap:nowrap;flex:none}
.sheet-head .sub{font-size:.9rem;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.sheet-body{display:flex;flex-direction:column;gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--scrim);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-box{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.who-btn{min-height:68px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:8px 14px;text-align:left}
.who-btn:hover{border-color:var(--accent)}
.who-btn b{font-size:1.08rem;font-weight:600} .who-btn small{color:var(--muted)}
.pin-dots{display:flex;gap:12px;justify-content:center;padding:6px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2)}
.pin-dots i.on{background:var(--accent);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{min-height:62px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font:600 1.45rem var(--f-display);cursor:pointer}
.keypad button.ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1.05rem}
.err{color:var(--bad);font-weight:600;text-align:center;min-height:1.4em}

/* route track */
.track{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.tk{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:1px;min-width:0}
.tk .tk-no{font:700 1.05rem var(--f-display);color:var(--muted)}
.tk .tk-nm{font-weight:600;font-size:.88rem;line-height:1.3}
.tk .tk-meta{font-size:.76rem;color:var(--muted);overflow-wrap:anywhere}
.tk.done{background:var(--surface-2)}
.tk.done .tk-no{color:var(--good)}
.tk.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tk.cur .tk-no{color:var(--accent)}
.stepno{display:inline-grid;place-items:center;min-width:2.1em;height:2.1em;padding:0 .4em;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 1rem var(--f-display);margin-right:8px;vertical-align:middle}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flabel{font-size:.86rem;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{min-height:48px;border:1px solid var(--line-2);border-radius:9px;padding:8px 12px;background:var(--surface);width:100%;min-width:0}
textarea.input{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mat-editor{display:flex;flex-direction:column;gap:8px}
.mat-editor.layers{counter-reset:layer}
.mrow,.irow{display:grid;grid-template-columns:minmax(0,1fr) 110px 92px 44px;gap:8px;align-items:center}
.mat-editor.layers .mrow{grid-template-columns:62px minmax(0,1fr) 100px 84px 44px;counter-increment:layer}
.layer-no{font-size:.86rem;font-weight:600;color:var(--ink-2)}
.layer-no::after{content:counter(layer)}
.mrow select,.mrow input,.irow select,.irow input{min-height:48px;border:1px solid var(--line-2);border-radius:9px;padding:6px 10px;background:var(--surface);width:100%;min-width:0}
.irow{grid-template-columns:minmax(0,1fr) 96px minmax(0,190px) 44px}
@media (max-width:520px){
  .mrow{grid-template-columns:minmax(0,1fr) 84px 72px 44px}
  .mat-editor.layers .mrow{grid-template-columns:minmax(0,1fr) 84px 72px 44px}
  .mat-editor.layers .layer-no{grid-column:1/-1}
  .irow{grid-template-columns:minmax(0,1fr) 72px 44px}
  .irow .i-route{grid-column:1/3}
}
.std-line{font-size:.88rem;color:var(--ink-2)}
.std-line b{font-weight:600;color:var(--ink)}
.chips-pick{display:flex;flex-wrap:wrap;gap:6px}
.hist{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.hist-item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.9rem;align-items:start}
.hist-item:last-child{border-bottom:0}
.hist-item .t{font-size:.8rem;color:var(--muted);white-space:nowrap}
.hist-item .d{min-width:0;overflow-wrap:anywhere}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.feed{display:flex;flex-direction:column}
.feed-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.feed-item:last-child{border-bottom:0}
.feed-item .t{color:var(--muted);font-size:.82rem;width:88px;flex:none}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}

.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.label{background:#fff;color:#111;border:1px solid #c9c9c9;border-radius:8px;padding:10px;display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;break-inside:avoid}
.label svg{width:96px;height:96px;display:block}
.label .lc{font:600 .82rem var(--f-mono);overflow-wrap:anywhere}
.label .lp{font-size:.82rem;line-height:1.3}
.label .lr{font-size:.72rem;color:#555}

.langsw button{border:0;background:none;min-height:36px;padding:2px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--ink-2);line-height:1.2}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.th-sub{display:block;font-size:.74rem;font-weight:500;color:var(--muted);line-height:1.3}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
.login{max-width:420px;margin:8vh auto 0;width:100%}

}

/** แปลข้อความ · vars แทน {ชื่อ} ในข้อความ · lang ไม่ระบุ = ภาษาปัจจุบัน */
function tr(key, vars, lang){
  const row = I18N[key]; if(!row) return key;
  let out = row[LANG_IDX[lang || S.lang] ?? 0] || row[0];
  if(vars) out = out.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
  return out;
}
const trL = (key, vars) => lang => tr(key, vars, lang);   // ข้อความที่จะแปลทีหลังตามภาษาของช่าง (ใช้กับหน้าใส่ PIN)

  lang: (k => LANG_IDX.hasOwnProperty(k) ? k : 'th')(lsGet('lang')),
  session: null, dashRange: 30, orderFilter: 'open', setTab: 'workers', sheet: null, confirmKey: null
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() :
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16) });
function lsGet(k){ try { return localStorage.getItem('mi:'+k) } catch(e){ return null } }
function lsSet(k,v){ try { localStorage.setItem('mi:'+k, v) } catch(e){} }
const num = v => { const n = Number(v); return isFinite(n) ? n : 0 };
const pad = n => String(n).padStart(2,'0');
const fmt = (n,d=0) => num(n).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const baht = n => '฿' + fmt(Math.round(num(n)));
const nowISO = () => new Date().toISOString();
function toDate(s){ return new Date(s && s.length===10 ? s+'T00:00:00' : s) }
function fDate(s){ if(!s) return '–'; const d = toDate(s); return d.getDate()+' '+tr('months').split(',')[d.getMonth()] }
function fTime(s){ const d = toDate(s); return pad(d.getHours())+':'+pad(d.getMinutes()) }
function fDT(s){ if(!s) return '–'; const d = toDate(s), t = new Date(); return (d.toDateString()===t.toDateString() ? tr('today') : fDate(s)) + ' ' + fTime(s) }
function localDate(d=new Date()){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()) }
const mins = (a,b) => (toDate(b) - toDate(a)) / 60000;
function fMins(m){ m = Math.max(0, Math.round(m)); if(m < 60) return m+' '+tr('u.min'); const h = Math.floor(m/60), r = m%60; return h+' '+tr('u.hr')+(r ? ' '+r+' '+tr('u.minShort') : '') }
function fQty(q, unit){ q = num(q); if(unit==='kg') return q < 1 ? fmt(q*1000)+' '+tr('unit.g') : fmt(q,2)+' '+tr('unit.kg'); if(unit==='m') return fmt(q,1)+' '+tr('unit.m'); return fmt(q)+' '+tr('unit.pcs') }
const byId = arr => Object.fromEntries((arr||[]).map(x => [x.id, x]));
function groupBy(arr, k){ const o = {}; for(const x of arr||[]) (o[x[k]] ||= []).push(x); return o }
function daysTo(dateStr){ const d = toDate(dateStr); d.setHours(0,0,0,0); const t = new Date(); t.setHours(0,0,0,0); return Math.round((d - t)/86400000) }
async function sha256hex(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}
function toast(msg, kind=''){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast ' + kind; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, kind==='bad' ? 4200 : 2600);
}

async function fetchAll(table, source){
  let out = [], from = 0; const size = 1000;
  for(;;){
    const { data, error } = await S.sb.from(source || table).select('*').range(from, from + size - 1);
    if(error) throw error;
    out = out.concat(data); if(data.length < size) break; from += size;
  }
  return out;
}
async function loadAll(){
  if(S.mode==='demo'){
    S.data = demoLoad() || await seedDemo();
    for(const t of TABLES) S.data[t] ||= [];
    demoSave();
  } else {
    const d = {};
    await Promise.all(TABLES.map(async t => {
      d[t] = await fetchAll(t, t==='workers' && S.deviceRole!=='manager' ? 'workers_public' : t);
    }));
    S.data = d;

}

async function verifyPin(w, pin){

  const w = S.data.workers.find(x => x.id===wid); w.pin_hash = await sha256hex(wid+':'+pin); demoSave();
}
function compressImage(file, maxSide, quality){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res({blob:b, dataUrl:c.toDataURL('image/jpeg', quality)}) : rej(new Error('แปลงรูปไม่สำเร็จ')), 'image/jpeg', quality);
    };
    img.onerror = () => rej(new Error('อ่านไฟล์รูปไม่ได้'));
    img.src = url;
  });
}
async function uploadPhoto(input){
  const f = input && input.files && input.files[0]; if(!f) return null;
  if(S.mode==='demo'){ const r = await compressImage(f, 720, .6); return r.dataUrl }
  const r = await compressImage(f, 1400, .75);
  const path = localDate().slice(0,7) + '/' + uid() + '.jpg';
  const { error } = await S.sb.storage.from('qc-photos').upload(path, r.blob, {contentType:'image/jpeg'});
  if(error) throw error;
  return S.sb.storage.from('qc-photos').getPublicUrl(path).data.publicUrl;
}

function reindex(){
  const D = S.data;
  M = {
    worker: byId(D.workers), material: byId(D.materials), product: byId(D.products),
    order: byId(D.orders), piece: byId(D.pieces),
    logsByPiece: groupBy(D.step_logs, 'piece_id'), qcByPiece: groupBy(D.qc_records, 'piece_id'),
    piecesByOrder: groupBy(D.pieces, 'order_id'), itemsByOrder: groupBy(D.order_items, 'order_id'),
    state: {}
  };
  for(const p of D.pieces) M.state[p.id] = computeState(p);
}
function computeState(p){
  const logs = (M.logsByPiece[p.id]||[]).slice().sort((a,b) => a.started_at < b.started_at ? -1 : 1);
  const qcs = (M.qcByPiece[p.id]||[]).slice().sort((a,b) => a.created_at < b.created_at ? -1 : 1);
  const route = ROUTES[p.route] || ROUTES.A;
  const done = new Map(); for(const l of logs) if(l.status==='done') done.set(l.step, l);
  const base = {logs, qcs, route, done, doneCount: route.filter(s => done.has(s)).length, total: route.length};
  if(p.scrapped) return {...base, status:'scrap'};
  const active = logs.find(l => l.status==='in_progress');
  if(active) return {...base, status:'working', step:active.step, log:active};
  const next = route.find(s => !done.has(s));
  if(next) return {...base, status:'waiting', step:next};
  const last = done.get('S7');
  const fq = qcs.filter(q => q.step==='S7' && q.created_at >= last.finished_at).pop();
  if(fq && fq.result==='pass') return {...base, status:'done', doneAt: fq.created_at};
  return {...base, status:'qc', step:'S7'};
}
function qcPending(){
  const out = [];
  for(const p of S.data.pieces){
    const s = M.state[p.id]; if(s.status==='scrap') continue;
    for(const pt of QC_POINTS){
      const l = s.done.get(pt); if(!l) continue;
      if(!s.qcs.some(q => q.step===pt && q.created_at >= l.finished_at)) out.push({piece:p, point:pt, at:l.finished_at});
    }
  }
  return out.sort((a,b) => a.at < b.at ? -1 : 1);
}
function orderStats(o){
  const items = M.itemsByOrder[o.id] || [];
  const target = items.reduce((a,i) => a + num(i.qty), 0);
  const ps = M.piecesByOrder[o.id] || [];
  const live = ps.filter(p => !p.scrapped);
  const done = live.filter(p => M.state[p.id].status==='done').length;
  return {target, done, wip: live.length - done, scrap: ps.length - live.length, complete: target > 0 && done >= target};
}
function dueChip(due, complete){
  if(!due) return '';
  if(complete) return `<span class="chip good">${tr('due.done')}</span>`;
  const d = daysTo(due);
  if(d < 0) return `<span class="chip bad">${tr('due.late', {n:-d})}</span>`;
  if(d <= 2) return `<span class="chip warn">${tr('due.on', {d:fDate(due)})}</span>`;
  return `<span class="chip">${tr('due.on', {d:fDate(due)})}</span>`;
}
function logMins(l){ return l.finished_at ? mins(l.started_at, l.finished_at) : 0 }
function stdFor(p, step){ return M.product[p.product_id]?.standard?.[step] || null }
function logCost(l){
  let mat = 0; for(const m of l.materials||[]){ const mt = M.material[m.material_id]; if(mt) mat += num(m.qty) * num(mt.unit_cost) }
  const m = logMins(l); return {mat, labor: m/60 * workerRate(l.finished_by || l.worker_id), mins: m};
}
function stdCost(productId, route){
  const pr = M.product[productId]; let mat = 0, m = 0;
  for(const s of ROUTES[route]){ const sd = pr?.standard?.[s]; if(!sd) continue; m += num(sd.minutes);
    for(const x of sd.materials||[]){ const mt = M.material[x.material_id]; if(mt) mat += num(x.qty) * num(mt.unit_cost) } }
  return {mat, labor: m/60 * defaultRate(), mins: m};
}
function stockLevels(){
  const lv = {}; for(const m of S.data.materials) lv[m.id] = {onHand:0, used30:0};
  const from = Date.now() - 30*86400000;
  for(const r of S.data.stock_receipts) if(lv[r.material_id]) lv[r.material_id].onHand += num(r.qty);
  for(const l of S.data.step_logs){ if(l.status!=='done' && l.status!=='reworked') continue;
    for(const m of l.materials||[]){ const x = lv[m.material_id]; if(!x) continue; x.onHand -= num(m.qty); if(toDate(l.finished_at) >= from) x.used30 += num(m.qty) } }
  return lv;
}

/* ---------- worker picker + PIN ---------- */
// title/sub เป็นข้อความ หรือฟังก์ชัน (lang) => ข้อความ · พอเลือกชื่อ หน้าใส่ PIN จะเปลี่ยนเป็นภาษาของคนนั้น
// ใส่ PIN ถูก → ทั้งจอเปลี่ยนเป็นภาษาของช่างคนนั้น (ช่างแต่ละคนตั้งภาษาได้ในหน้า ตั้งค่า → ช่าง)
function askWorker({title, minRank=1, preselect=null, sub=''}){
  return new Promise(resolve => {
    const list = S.data.workers.filter(w => w.active !== false && (ROLE_RANK[w.role]||0) >= minRank)
      .sort((a,b) => (ROLE_RANK[a.role]-ROLE_RANK[b.role]) || a.name.localeCompare(b.name,'th'));
    let sel = (preselect && list.find(w => w.id===preselect)) || (list.length===1 ? list[0] : null);
    let pin = '', err = null, busy = false;
    const modal = $('#modal');
    const txt = (v, L) => typeof v === 'function' ? v(L) : (v || '');
    const draw = () => {
      const L = sel && LANG_IDX.hasOwnProperty(sel.lang) ? sel.lang : S.lang;
      const T = (k, v) => tr(k, v, L);
      modal.lang = L;
      if(!list.length){ modal.innerHTML = `<div class="modal-box"><h2>${esc(txt(title, L))}</h2><p>${T('pin.none')}</p><button class="btn" data-m="cancel">${T('close')}</button></div>`; return }
      if(!sel){
        modal.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true" aria-label="${esc(txt(title, L))}">
          <div class="sec-head"><h2>${esc(txt(title, L))}</h2><button class="icon-btn" data-m="cancel" aria-label="${T('cancel')}">×</button></div>
          ${sub ? `<p class="ink2" style="margin:0">${esc(txt(sub, L))}</p>` : ''}
          <div class="who-grid">${list.map(w => `<button class="who-btn" data-m="who" data-id="${w.id}"><b>${esc(w.name)}</b><small>${T('role.'+w.role)}${w.lang && w.lang!=='th' ? ' · '+LANG_LABEL[w.lang] : ''}</small></button>`).join('')}</div>
        </div>`;
      } else {
        modal.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true" aria-label="PIN">
          <div class="sec-head"><h2>${esc(txt(title, L))}</h2><button class="icon-btn" data-m="cancel" aria-label="${T('cancel')}">×</button></div>
          <div class="row" style="justify-content:space-between"><span>${T('pin.enter', {name:`<b>${esc(sel.name)}</b>`})}</span>${list.length > 1 ? `<button class="btn btn-sm btn-ghost" data-m="back">${T('pin.switch')}</button>` : ''}</div>
          <div class="pin-dots">${Array.from({length:Math.max(4,pin.length)}, (_,i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join('')}</div>
          <div class="err">${err ? esc(T(err.k) + (err.x ? ' ' + err.x : '')) : ''}</div>
          <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(k => `<button data-m="key" data-k="${k}">${k}</button>`).join('')}
            <button data-m="del" aria-label="${T('pin.del')}">⌫</button><button data-m="key" data-k="0">0</button><button class="ok" data-m="ok">${busy ? T('pin.checking') : T('pin.ok')}</button></div>
          ${S.mode==='demo' ? `<p class="muted" style="margin:0;text-align:center;font-size:.85rem">${T('pin.demo')}</p>` : ''}
        </div>`;
      }
    };
    const close = v => {
      modal.hidden = true; modal.innerHTML = ''; modal.onclick = null; modal.removeAttribute('lang');
      document.removeEventListener('keydown', onKey, true);
      if(v && LANG_IDX.hasOwnProperty(v.lang)) setLang(v.lang, {render:false});   // ผู้เรียกจะวาดจอใหม่เอง
      resolve(v);
    };
    const tryPin = async () => {
      if(busy || pin.length < 4) { if(pin.length < 4){ err = {k:'pin.min'}; draw() } return }
      busy = true; draw();
      try { const ok = await verifyPin(sel, pin); busy = false; if(ok) return close(sel); err = {k:'pin.wrong'}; pin = ''; draw() }
      catch(e){ busy = false; err = {k:'pin.fail', x:errMsg(e)}; draw() }
    };
    const onKey = e => {
      if(!sel) { if(e.key==='Escape') close(null); return }
      if(/^[0-9]$/.test(e.key) && pin.length < 6){ pin += e.key; err=null; draw(); e.preventDefault() }
      else if(e.key==='Backspace'){ pin = pin.slice(0,-1); draw(); e.preventDefault() }
      else if(e.key==='Enter'){ tryPin(); e.preventDefault() }
      else if(e.key==='Escape') close(null);
    };
    modal.onclick = e => {
      if(e.target===modal) return close(null);
      const b = e.target.closest('[data-m]'); if(!b) return;
      const a = b.dataset.m;
      if(a==='cancel') close(null);
      else if(a==='who'){ sel = list.find(w => w.id===b.dataset.id); pin=''; err=null; draw() }
      else if(a==='back'){ sel = null; pin=''; err=null; draw() }
      else if(a==='key'){ if(pin.length < 6){ pin += b.dataset.k; err=null; draw() } }
      else if(a==='del'){ pin = pin.slice(0,-1); draw() }
      else if(a==='ok') tryPin();
    };
    document.addEventListener('keydown', onKey, true);
    modal.hidden = false; draw();
  });
}

function pieceCard(p){
  const s = M.state[p.id], pr = M.product[p.product_id], o = M.order[p.order_id];
  const pips = s.route.map(st => `<i class="${s.done.has(st) ? 'd' : (st===s.step && s.status==='working' ? 'c' : '')}"></i>`).join('');
  const foot = s.status==='working'
    ? `<span><b>${esc(wName(s.log.worker_id))}</b> · <span data-since="${s.log.started_at}">${fMins(mins(s.log.started_at, nowISO()))}</span></span>`
    : `<span class="muted">${tr('routeLabel', {r:p.route})} · ${routeName(p.route)}</span>`;
  return `<button class="pcard ${s.status==='working' ? 'working' : ''}" data-act="openPiece" data-id="${p.id}">
    <div class="pc-top"><span class="mono">${esc(p.code)}</span>${dueChip(o?.due_date, false)}</div>
    <div class="pc-prod">${esc(pr?.name || '–')}</div>
    <div class="pc-meta">${esc(o?.order_no)} · ${esc(o?.customer || '')}</div>
    <div class="pc-foot">${foot}<span class="pips" aria-label="${tr('card.doneOf', {d:s.doneCount, n:s.total})}">${pips}</span></div>
  </button>`;
}
function vFloor(){
  const counts = {}; for(const k of STEP_ORDER) counts[k] = {w:0, q:0};
  for(const p of S.data.pieces){ const s = M.state[p.id]; if(s.status==='working') counts[s.step].w++; else if(s.status==='waiting') counts[s.step].q++ }
  const step = S.stationStep, st = STEPS[step];
  const dueKey = p => M.order[p.order_id]?.due_date || '9999';
  const here = S.data.pieces.filter(p => M.state[p.id].step===step);
  const working = here.filter(p => M.state[p.id].status==='working').sort((a,b) => M.state[a.id].log.started_at < M.state[b.id].log.started_at ? -1 : 1);
  const waiting = here.filter(p => M.state[p.id].status==='waiting').sort((a,b) => dueKey(a) < dueKey(b) ? -1 : dueKey(a) > dueKey(b) ? 1 : (a.code < b.code ? -1 : 1));
  const pcs = n => tr('floor.pcs', {n});
  return `
  <div class="floor-head">
    <form class="scan" data-form="scan"><input id="scan" class="mono" placeholder="${tr('floor.scan')}" autocomplete="off" aria-label="${tr('floor.scanAria')}"><button class="btn" type="submit">${tr('floor.open')}</button></form>
    <button class="btn" data-act="myWork">${tr('floor.myWork')}</button>
  </div>
  <div class="stepbar-wrap"><div class="stepbar" role="group" aria-label="${tr('floor.pickStep')}">
    ${STEP_ORDER.map(k => `<button class="stepbtn" data-act="pickStep" data-v="${k}" aria-pressed="${k===step}">
      <span class="no">${STEPS[k].no}</span><span class="nm">${stepName(k)}${thSub(k)}</span>
      ${STEPS[k].route ? `<span class="rt">${tr('onlyRoute', {r:STEPS[k].route})}</span>` : ''}
      <span class="cnt"><b>${counts[k].w}</b> ${tr('floor.working')} · <b>${counts[k].q}</b> ${tr('floor.waiting')}</span></button>`).join('')}
  </div></div>
  ${!working.length && !waiting.length ? `<section class="section" id="queue">
    <div class="sec-head"><h2><span class="stepno">${st.no}</span>${stepName(step)}</h2><span class="muted">${stepHint(step)}</span></div>
    ${emptyStepHint(step, counts)}
  </section>` : `
  <section class="section" id="queue">
    <div class="sec-head"><h2><span class="stepno">${st.no}</span>${stepName(step)} · ${tr('floor.working')}<span class="count">${pcs(working.length)}</span></h2><span class="muted">${stepHint(step)}</span></div>
    ${working.length ? `<div class="cards">${working.map(pieceCard).join('')}</div>` : `<div class="empty">${tr('floor.nobody')}</div>`}
  </section>
  <section class="section">
    <div class="sec-head"><h2>${tr('floor.queue')}<span class="count">${pcs(waiting.length)} · ${tr('floor.byDue')}</span></h2></div>
    ${waiting.length ? `<div class="cards">${waiting.map(pieceCard).join('')}</div>` : `<div class="empty">${tr('floor.noneWait')}</div>`}
  </section>`}`;
}
function emptyStepHint(step, counts){
  const where = STEP_ORDER.filter(k => k!==step && (counts[k].w + counts[k].q) > 0)
    .map(k => `<button class="chip chip-btn" data-act="pickStep" data-v="${k}">${STEPS[k].no} ${stepName(k)} · ${tr('floor.pcs', {n:counts[k].w + counts[k].q})}</button>`).join('');
  const first = step==='S1';
  return `<div class="empty-act">
    <p><b>${tr('floor.emptyTitle', {step:stepName(step)})}</b></p>
    <p>${first ? tr('floor.emptyFirst') : tr('floor.emptyNext')}</p>
    ${first ? `<button class="btn btn-primary" data-act="floorNewOrder">${tr('floor.newOrder')}</button>` : ''}
    ${where ? `<span class="eyebrow">${tr('floor.whereNow')}</span><div class="chips-pick">${where}</div>` : ''}
  </div>`;
}

/* ---------- ใบงาน (piece sheet) ---------- */
function matOptions(sel, step){
  const cats = STEPS[step]?.cats || [];
  const order = [...cats, ...Object.keys(CAT_NAME).filter(c => !cats.includes(c))];
  return order.map(c => {
    const ms = S.data.materials.filter(m => m.category===c && (m.active !== false || m.id===sel));
    if(!ms.length) return '';
    return `<optgroup label="${catName(c)}">${ms.map(m => `<option value="${m.id}" ${m.id===sel ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</optgroup>`;
  }).join('');
}
function unitOptions(mat, sel){
  if(!mat) return '';
  if(mat.unit==='kg') return `<option value="kg" ${sel!=='g' ? 'selected' : ''}>${tr('unit.kg')}</option><option value="g" ${sel==='g' ? 'selected' : ''}>${tr('unit.gram')}</option>`;
  return `<option value="${mat.unit}">${unitName(mat.unit)}</option>`;
}
function defaultMat(step){
  const cats = STEPS[step]?.cats || [];
  for(const c of cats){ const m = S.data.materials.find(x => x.category===c && x.active !== false); if(m) return m.id }
  return S.data.materials.find(x => x.active !== false)?.id;
}
function matRow(r, step, layers){
  const id = r.material_id || defaultMat(step), mat = M.material[id];
  let unit = mat?.unit, val = r.qty;
  if(mat?.unit==='kg' && val != null && num(val) < 1){ unit = 'g'; val = Math.round(num(val)*1000) }
  else if(val != null) val = +num(val).toFixed(3);
  return `<div class="mrow">${layers ? `<span class="layer-no">${tr('layer.prefix')} </span>` : ''}
    <select class="m-mat" aria-label="${tr('aria.mat')}" data-step="${step}">${matOptions(id, step)}</select>
    <input class="m-qty num" type="number" inputmode="decimal" step="any" min="0" value="${val ?? ''}" aria-label="${tr('aria.qty')}" placeholder="0">
    <select class="m-unit" aria-label="${tr('aria.unit')}">${unitOptions(mat, unit)}</select>
    <button type="button" class="icon-btn" data-act="delRow" aria-label="${tr('aria.delRow')}">×</button></div>`;
}
function matEditor(step, rows, key=''){
  const layers = !!STEPS[step]?.layers;
  return `<div class="mat-editor ${layers ? 'layers' : ''}" data-step="${step}" ${key ? `data-key="${key}"` : ''}>${rows.map(r => matRow(r, step, layers)).join('')}</div>
    <div><button type="button" class="btn btn-sm" data-act="addMatRow" data-step="${step}" ${key ? `data-key="${key}"` : ''}>+ ${layers ? tr('mat.addLayer') : tr('mat.add')}</button></div>`;
}
function readMatRows(root){
  const rows = []; let layer = 0; const layers = root.classList.contains('layers');
  for(const r of root.querySelectorAll('.mrow')){
    layer++;
    const id = r.querySelector('.m-mat').value, q = parseFloat(r.querySelector('.m-qty').value), u = r.querySelector('.m-unit').value;
    if(!id || !(q > 0)) continue;
    const o = {material_id:id, qty: +(u==='g' ? q/1000 : q).toFixed(4)};
    if(layers) o.layer = layer;
    rows.push(o);
  }
  return rows;
}
function matsText(list){
  if(!list || !list.length) return '–';
  return list.map(m => { const mt = M.material[m.material_id]; return (m.layer ? tr('layer.n', {n:m.layer})+' ' : '') + (mt ? mt.name : '?') + ' ' + fQty(m.qty, mt?.unit) }).join(' · ');
}
function seg(name, opts, sel, cls='', on=''){
  return `<div class="seg ${cls}" data-name="${name}" ${on ? `data-on="${on}"` : ''} role="group">${opts.map(([v,l]) => `<button type="button" data-act="seg" data-v="${esc(v)}" aria-pressed="${String(v)===String(sel)}">${esc(l)}</button>`).join('')}</div>`;
}
function readSeg(name){ const b = document.querySelector(`.seg[data-name="${name}"] button[aria-pressed="true"]`); return b ? b.dataset.v : null }
function routeTrack(p, s){
  return `<ol class="track">${s.route.map(st => {
    const l = s.done.get(st); const cur = (s.status==='working' || s.status==='waiting') && s.step===st;
    const meta = l ? `${esc(wName(l.finished_by || l.worker_id))} · ${fMins(logMins(l))}` : (cur ? (s.status==='working' ? tr('floor.working') : tr('piece.next')) : '');
    return `<li class="tk ${l ? 'done' : ''} ${cur ? 'cur' : ''}"><span class="tk-no">${l ? '✓ ' : ''}${STEPS[st].no}</span><span class="tk-nm">${stepName(st)}</span>${meta ? `<span class="tk-meta">${meta}</span>` : ''}</li>`;
  }).join('')}</ol>`;
}
function stdLine(p, step){
  const sd = stdFor(p, step);
  if(!sd) return `<div class="std-line muted">${tr('std.none')}</div>`;
  return `<div class="std-line">${tr('std.label')} <b>${fMins(num(sd.minutes))}</b>${sd.passes ? ` · <b>${tr('piece.passN', {n:sd.passes})}</b>` : ''}${sd.materials && sd.materials.length ? ' · ' + esc(matsText(sd.materials)) : ''}</div>`;
}
const LOG_CHIP = {in_progress:'info', done:'good', cancelled:'', reworked:'warn'};
const QC_CHIP = {pass:'good', rework:'warn', scrap:'bad'};
function shPiece(id){

    const pv = sd.passes || st.defPass;
    action = `<div class="panel action"><span class="eyebrow">${tr('floor.working')}</span>

      <div class="ink2">${tr('piece.startedBy', {name:esc(wName(s.log.worker_id)), time:fDT(s.log.started_at), elapsed:`<b data-since="${s.log.started_at}">${fMins(mins(s.log.started_at, nowISO()))}</b>`})}</div>
      ${stdLine(p, s.step)}
      ${st.passes ? `<div class="field"><span class="flabel">${tr('piece.passes')}</span>${seg('passes', st.passes.map(n => [n, tr('piece.passN', {n})]), pv)}</div>` : ''}
      <div class="field"><span class="flabel">${st.layers ? tr('piece.layers') : tr('piece.materials')}</span>
        ${rows.length || st.cats.some(c => c!=='other') ? '' : `<span class="muted" style="font-size:.88rem">${tr('piece.noMat')}</span>`}
        ${matEditor(s.step, rows, 'log')}</div>

      <div class="row"><button class="btn btn-primary btn-xl" data-act="finishStep" data-id="${s.log.id}">${tr('piece.finish')}</button>
        <button class="btn btn-ghost" data-act="cancelStep" data-id="${s.log.id}">${tr('piece.cancel')}</button></div></div>`;
  } else if(s.status==='qc'){

  } else if(s.status==='done'){
    action = `<div class="panel"><span class="chip good" style="align-self:flex-start"><span class="dot"></span>${tr('piece.ready')}</span><div class="ink2">${tr('piece.passedAt', {t:fDT(s.doneAt)})}</div></div>`;
  } else {
    action = `<div class="panel"><span class="chip bad" style="align-self:flex-start"><span class="dot"></span>${tr('piece.scrap')}</span><div class="ink2">${esc(defectName(p.scrap_reason))}</div></div>`;
  }
  const events = [
    ...s.logs.map(l => ({t:l.started_at, h:`<span class="t">${fDT(l.started_at)}</span><span class="d"><b>${esc(stepLabel(l.step))}</b> · ${esc(wName(l.finished_by || l.worker_id))}${l.finished_at ? ' · '+fMins(logMins(l)) : ''}${l.passes ? ' · '+tr('piece.passN', {n:l.passes}) : ''}
        ${l.materials && l.materials.length ? `<br><span class="muted">${esc(matsText(l.materials))}</span>` : ''}${l.note ? `<br><span class="ink2">${esc(l.note)}</span>` : ''}</span>
        <span><span class="chip ${LOG_CHIP[l.status]}">${tr('st.'+l.status)}</span>${l.photo_url ? `<br><img class="thumb" src="${esc(l.photo_url)}" alt="${tr('piece.photo')}">` : ''}</span>`})),

}

/* ---------- ผลงานของฉัน ---------- */
function shMyWork(wid){
  const w = M.worker[wid];
  const logs = S.data.step_logs.filter(l => (l.finished_by || l.worker_id)===wid && l.finished_at && (l.status==='done' || l.status==='reworked')).sort((a,b) => a.finished_at < b.finished_at ? 1 : -1);
  const t0 = new Date(); t0.setHours(0,0,0,0); const w0 = t0.getTime() - 6*86400000;
  const agg = from => { const xs = logs.filter(l => toDate(l.finished_at) >= from); let m=0, sm=0, am=0;
    for(const l of xs){ const d = logMins(l); m += d; const p = M.piece[l.piece_id]; const sd = p && stdFor(p, l.step); if(sd && num(sd.minutes)){ sm += num(sd.minutes); am += d } }
    return {n:xs.length, m, eff: am ? sm/am*100 : null, rework: xs.filter(l => l.status==='reworked').length} };
  const td = agg(t0), wk = agg(new Date(w0));
  const active = S.data.step_logs.filter(l => l.worker_id===wid && l.status==='in_progress');
  return sheetHead(tr('my.title', {name:esc(w?.name)}), roleName(w?.role)) + `<div class="sheet-body">
    <div class="kpis">
      <div class="kpi"><span class="eyebrow">${tr('today')}</span><span class="v">${td.n}</span><span class="s">${tr('my.stepsDone', {m:fMins(td.m)})}</span></div>
      <div class="kpi"><span class="eyebrow">${tr('my.last7')}</span><span class="v">${wk.n}</span><span class="s">${tr('my.steps', {m:fMins(wk.m)})}</span></div>
      <div class="kpi"><span class="eyebrow">${tr('my.vsStd')}</span><span class="v">${wk.eff == null ? '–' : fmt(wk.eff)+'%'}</span><span class="s">${tr('my.vsStdSub', {n:wk.rework})}</span></div>
    </div>
    ${active.length ? `<section class="section"><h3>${tr('my.active')}</h3><div class="cards">${active.map(l => pieceCard(M.piece[l.piece_id])).join('')}</div></section>` : ''}
    <section class="section"><h3>${tr('my.recent')}</h3>
    ${logs.length ? `<div class="table-wrap"><table><thead><tr><th>${tr('col.doneAt')}</th><th>${tr('col.piece')}</th><th>${tr('col.step')}</th><th class="r">${tr('col.time')}</th><th class="r">${tr('col.std')}</th><th>${tr('col.status')}</th></tr></thead><tbody>
      ${logs.slice(0,30).map(l => { const p = M.piece[l.piece_id]; const sd = p && stdFor(p, l.step);
        return `<tr class="click" data-act="openPiece" data-id="${l.piece_id}"><td>${fDT(l.finished_at)}</td><td class="mono">${esc(p?.code)}</td><td>${esc(stepLabel(l.step))}</td><td class="r num">${fMins(logMins(l))}</td><td class="r num muted">${sd ? fMins(num(sd.minutes)) : '–'}</td><td><span class="chip ${LOG_CHIP[l.status]}">${tr('st.'+l.status)}</span></td></tr>` }).join('')}
    </tbody></table></div>` : `<div class="empty">${tr('my.none')}</div>`}</section></div>`;
}

function vQC(){

  const from = Date.now() - 30*86400000;
  const recent = S.data.qc_records.filter(q => toDate(q.created_at) >= from).sort((a,b) => a.created_at < b.created_at ? 1 : -1);
  const defects = {}; for(const q of recent) if(q.result!=='pass' && q.defect) defects[q.defect] = (defects[q.defect]||0) + 1;
  const dmax = Math.max(1, ...Object.values(defects));
  const pass = recent.filter(q => q.result==='pass').length;
  const group = pt => pend.filter(x => x.point===pt);
  const qcCard = x => { const p = x.piece, pr = M.product[p.product_id], o = M.order[p.order_id];

  return `
  ${QC_POINTS.map(pt => `<section class="section"><div class="sec-head"><h2>${tr('qc.waitFor', {pt:qcPointName(pt)})}<span class="count">${tr('floor.pcs', {n:group(pt).length})}</span></h2></div>
    ${group(pt).length ? `<div class="cards">${group(pt).map(qcCard).join('')}</div>` : `<div class="empty">${tr('qc.nonePending')}</div>`}</section>`).join('')}
  <div class="dash-grid">
    <section class="section"><div class="sec-head"><h2>${tr('qc.recent')}</h2><span class="muted">${tr('qc.passOf', {p:pass, n:recent.length})}</span></div>
      ${recent.length ? `<div class="table-wrap"><table><thead><tr><th>${tr('col.when')}</th><th>${tr('col.piece')}</th><th>${tr('col.point')}</th><th>${tr('col.result')}</th><th>${tr('col.defect')}</th><th>${tr('col.inspector')}</th></tr></thead><tbody>
      ${recent.slice(0,40).map(q => `<tr class="click" data-act="openPiece" data-id="${q.piece_id}"><td>${fDT(q.created_at)}</td><td class="mono">${esc(M.piece[q.piece_id]?.code)}</td><td>${esc(STEPS[q.step]?.no || q.step)}</td>
        <td><span class="chip ${QC_CHIP[q.result]}">${tr('qcr.'+q.result)}</span></td><td>${esc(q.defect ? defectName(q.defect) : '–')}</td><td>${esc(wName(q.inspector_id))}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">${tr('qc.noneRecent')}</div>`}</section>
    <section class="section"><div class="sec-head"><h2>${tr('qc.topDefects')}</h2><span class="muted">${tr('qc.30d')}</span></div>
      <div class="panel">${Object.keys(defects).length ? `<div class="wip">${Object.entries(defects).sort((a,b) => b[1]-a[1]).map(([d,n]) => `<div class="wip-row" title="${esc(defectName(d))}: ${tr('qc.times', {n})}"><span>${esc(defectName(d))}</span><div class="wip-track"><span class="s-qc" style="width:${n/dmax*100}%"></span></div><span class="num r">${n}</span></div>`).join('')}</div>` : `<span class="muted">${tr('qc.noDefects')}</span>`}</div></section>
  </div>`;
}
function shQC(pid, point){
  const p = M.piece[pid], s = M.state[pid], pr = M.product[p.product_id];
  const pt = point || (s.status==='qc' ? 'S7' : (s.done.has('S3') && !s.done.has('S7') ? 'S3' : 'S7'));
  const ri = s.route.indexOf(pt);
  const reworkOpts = s.route.filter((x,i) => i <= Math.max(ri, 0) || s.done.has(x));
  const defRework = pt==='S7' ? 'S6' : 'S4';
  return sheetHead(`QC <span class="mono">${esc(p.code)}</span>`, `${esc(pr?.name)} · ${tr('routeLabel', {r:p.route})}`) + `<div class="sheet-body">
    ${routeTrack(p, s)}
    <div class="panel action">
      <div class="field"><label for="qc-point">${tr('col.point')}</label><select id="qc-point" class="input">${s.route.map(x => `<option value="${x}" ${x===pt ? 'selected' : ''}>${esc(stepLabel(x))}${qcPointName(x) ? ' — '+qcPointName(x) : ''}</option>`).join('')}</select></div>
      <div class="field"><span class="flabel">${tr('qc.result')}</span>${seg('qcres', [['pass',tr('qcr.pass')],['rework',tr('qcr.rework')],['scrap',tr('qc.scrapBtn')]], 'pass', 'res', 'qcResChange')}</div>
      <div id="qc-more" hidden>
        <div class="field"><span class="flabel">${tr('qc.defectFound')}</span>${seg('defect', DEFECTS.map(d => [d, defectName(d)]), '', 'small')}</div>
        <div class="field" id="qc-rework-f" style="margin-top:12px"><label for="qc-rework">${tr('qc.reworkTo')}</label>
          <select id="qc-rework" class="input">${reworkOpts.map(x => `<option value="${x}" ${x===(reworkOpts.includes(defRework) ? defRework : reworkOpts[reworkOpts.length-1]) ? 'selected' : ''}>${esc(stepLabel(x))}</option>`).join('')}</select>

      </div>
      <div class="field"><label for="qc-note">${tr('piece.note')}</label><textarea id="qc-note" class="input" placeholder="${tr('qc.notePh')}"></textarea></div>
      <div class="field"><label for="qc-photo">${tr('qc.photo')}</label><input id="qc-photo" type="file" accept="image/*" capture="environment" class="input"></div>
      <div><button class="btn btn-primary btn-xl" data-act="saveQC" data-id="${p.id}">${tr('qc.save')}</button></div>

/* =====================================================================
   VIEW: ผู้บริหาร
   ===================================================================== */
function vDash(){
  const t0 = new Date(); t0.setHours(0,0,0,0);
  const from = t0.getTime() - (S.dashRange - 1) * 86400000;
  const inR = s => s && toDate(s) >= from;
  const P = S.data.pieces;
  const st = p => M.state[p.id];
  const wip = P.filter(p => ['waiting','working','qc'].includes(st(p).status));
  const doneR = P.filter(p => st(p).status==='done' && inR(st(p).doneAt));
  const orders = S.data.orders.map(o => ({o, s: orderStats(o)}));
  const open = orders.filter(x => !x.s.complete);
  const overdue = open.filter(x => x.o.due_date && daysTo(x.o.due_date) < 0);
  const qcR = S.data.qc_records.filter(q => inR(q.created_at));
  const qPass = qcR.filter(q => q.result==='pass').length;
  const ordR = S.data.orders.filter(o => toDate(o.received_date) >= from);
  const qtyR = ordR.reduce((a,o) => a + (M.itemsByOrder[o.id]||[]).reduce((b,i) => b + num(i.qty), 0), 0);

  // WIP by step
  const rows = STEP_ORDER.map(k => ({k, w: wip.filter(p => st(p).status==='working' && st(p).step===k).length, q: wip.filter(p => st(p).status==='waiting' && st(p).step===k).length}));
  const qcN = qcPending().length;
  const wmax = Math.max(1, ...rows.map(r => r.w + r.q), qcN);

  // logs in range
  const logsR = S.data.step_logs.filter(l => (l.status==='done' || l.status==='reworked') && inR(l.finished_at));
  const perW = {}, perS = {}, perM = {};
  for(const l of logsR){
    const wid = l.finished_by || l.worker_id, d = logMins(l), p = M.piece[l.piece_id], sd = p && stdFor(p, l.step);
    const a = perW[wid] ||= {n:0, m:0, sm:0, am:0, rw:0, pcs:new Set(), last:''};
    a.n++; a.m += d; a.pcs.add(l.piece_id); if(l.status==='reworked') a.rw++; if(l.finished_at > a.last) a.last = l.finished_at;
    if(sd && num(sd.minutes)){ a.sm += num(sd.minutes); a.am += d }
    const b = perS[l.step] ||= {n:0, m:0, sm:0, sn:0}; b.n++; b.m += d; if(sd && num(sd.minutes)){ b.sm += num(sd.minutes); b.sn++ }
    for(const x of l.materials||[]){ const c = perM[x.material_id] ||= {act:0, std:0}; c.act += num(x.qty) }
    for(const x of (sd && sd.materials) || []){ const c = perM[x.material_id] ||= {act:0, std:0}; c.std += num(x.qty) }
  }
  const activeNow = {}; for(const l of S.data.step_logs) if(l.status==='in_progress') activeNow[l.worker_id] = l;

  // cost per finished piece
  const costs = doneR.map(p => { let mat = 0, lab = 0, m = 0;
    for(const l of st(p).logs) if(l.status==='done' || l.status==='reworked'){ const c = logCost(l); mat += c.mat; lab += c.labor; m += c.mins }
    const sc = stdCost(p.product_id, p.route); return {p, mat, lab, m, tot: mat+lab, std: sc.mat + sc.labor} })
    .sort((a,b) => st(a.p).doneAt < st(b.p).doneAt ? 1 : -1);
  const varCell = (act, std) => { if(!std) return '<td class="r muted">–</td>'; const v = (act/std - 1)*100; return `<td class="r num ${v > 5 ? 'var-up' : v < -5 ? 'var-dn' : ''}">${v > 0 ? '+' : ''}${fmt(v)}%</td>` };

  // feed
  const feed = [
    ...S.data.step_logs.filter(l => l.status!=='cancelled').map(l => ({t: l.finished_at || l.started_at, h:`<b>${esc(wName(l.finished_by || l.worker_id))}</b> ${l.finished_at ? 'เสร็จ' : 'เริ่ม'} ${esc(stepLabel(l.step))} · <span class="mono">${esc(M.piece[l.piece_id]?.code)}</span>`, pid:l.piece_id})),
    ...S.data.qc_records.map(q => ({t:q.created_at, h:`<b>${esc(wName(q.inspector_id))}</b> ตรวจ QC ${{pass:'ผ่าน', rework:'ส่งแก้', scrap:'ชิ้นงานเสีย'}[q.result]} · <span class="mono">${esc(M.piece[q.piece_id]?.code)}</span>`, pid:q.piece_id})),
    ...S.data.orders.map(o => ({t:o.created_at, h:`รับออเดอร์ <span class="mono">${esc(o.order_no)}</span> · ${esc(o.customer)}`}))
  ].sort((a,b) => a.t < b.t ? 1 : -1).slice(0,14);

  return `
  <div class="sec-head"><h2>ภาพรวมการผลิต</h2><div class="row">${seg('range', [[1,'วันนี้'],[7,'7 วัน'],[30,'30 วัน'],[90,'90 วัน']], S.dashRange, 'small', 'dashRange')}
    ${FRAMED ? '' : `<button class="btn btn-sm" data-act="exportCSV">ส่งออก CSV</button>`}</div></div>
  <div class="kpis">
    <div class="kpi"><span class="eyebrow">ชิ้นงานในสายผลิต</span><span class="v">${wip.length}</span><span class="s">รอ QC ${qcN} จุดตรวจ</span></div>
    <div class="kpi"><span class="eyebrow">เสร็จพร้อมส่ง · ช่วงนี้</span><span class="v">${doneR.length}</span><span class="s">ชิ้นที่ผ่าน QC ขั้นสุดท้าย</span></div>
    <div class="kpi"><span class="eyebrow">ออเดอร์ที่ยังไม่ครบ</span><span class="v">${open.length}</span><span class="s" ${overdue.length ? 'style="color:var(--bad);font-weight:600"' : ''}>เลยกำหนด ${overdue.length} ออเดอร์</span></div>
    <div class="kpi"><span class="eyebrow">รับออเดอร์ใหม่ · ช่วงนี้</span><span class="v">${ordR.length}</span><span class="s">รวม ${qtyR} ชิ้น</span></div>
    <div class="kpi"><span class="eyebrow">ผ่าน QC ครั้งแรก</span><span class="v">${qcR.length ? fmt(qPass/qcR.length*100)+'%' : '–'}</span><span class="s">ส่งแก้ ${qcR.filter(q => q.result==='rework').length} · เสีย ${qcR.filter(q => q.result==='scrap').length}</span></div>
  </div>
  <div class="dash-grid">

/* =====================================================================
   ACTIONS
   ===================================================================== */
async function guarded(fn){ try { await fn() } catch(e){ console.error(e); toast(tr('t.saveFail') + ' ' + errMsg(e), 'bad') } }
const ACT = {
  async tab(d){
    const tb = TABS.find(x => x.id===d.v);
    if(tb.min > rank()){
      const w = await askWorker({title: L => tr('ask.unlock', {tab:tr('tab.'+tb.id, null, L)}, L), minRank:tb.min, sub: trL(tb.min===3 ? 'ask.needMgr' : 'ask.needSup')});
      if(!w) return; startSession(w);
    }
    S.view = tb.id; S.confirmKey = null; render(); window.scrollTo(0,0);
  },
  lock(){ lock(); toast(tr('t.locked')) },
  setLang(d){ if(S.mode==='supabase' && !S.data.workers){ setLang(d.v, {render:false}); vLogin() } else setLang(d.v) },
  async reload(){ await guarded(async () => { await loadAll(); render(); toast(tr('t.reloaded')) }) },
  resetDemo(){
    if(S.confirmKey!=='reset'){ S.confirmKey = 'reset'; renderBanner(); return }
    S.confirmKey = null;
    guarded(async () => { try { localStorage.removeItem(DEMO_KEY) } catch(e){} S.session = null; S.view = 'floor'; closeSheet(); await loadAll(); render(); toast(tr('demo.resetDone')) });
  },
  pickStep(d){
    S.stationStep = d.v; lsSet('stationStep', d.v); render();
    const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'auto';

    else if(h >= 16.5){ d.setDate(d.getDate()+1); if(d.getDay()===0) d.setDate(d.getDate()+1); d.setHours(8, Math.floor(rnd(0,40)), 0, 0) }
    return d.getTime() };
  const qc = (p, step, t, result, extra={}) => D.qc_records.push({id:uid(), piece_id:p.id, step, inspector_id:wSup.id, result, defect:null, rework_step:null, note:null, photo_url:null, created_at:iso(t), ...extra});
  function sim(p, pr, startT, opt={}){
    const route = ROUTES[p.route]; let i = 0, t = startT, reworked = false;
    while(i < route.length){
      const step = route[i], sd = pr.standard[step] || {minutes:30};
      t = work(t); if(t > NOW) return;
      const dur = num(sd.minutes) * rnd(0.82, 1.42) * 60000, w = pick(SW[step]);
      if(t + dur > NOW){
        if(!busy[w.id] && NOW - t < 5*H){ busy[w.id] = 1; D.step_logs.push({id:uid(), piece_id:p.id, step, worker_id:w.id, finished_by:null, started_at:iso(t), finished_at:null, passes:null, materials:[], note:null, photo_url:null, status:'in_progress', created_at:iso(t)}) }
        return;
      }
      const mats = (sd.materials||[]).map(m => ({material_id:m.material_id, qty:+(m.qty * rnd(0.93, 1.24)).toFixed(3), ...(m.layer ? {layer:m.layer} : {})}));
      D.step_logs.push({id:uid(), piece_id:p.id, step, worker_id:w.id, finished_by:w.id, started_at:iso(t), finished_at:iso(t+dur), passes:sd.passes || null, materials:mats, note:null, photo_url:null, status:'done', created_at:iso(t)});
      t += dur;
      if(step==='S3'){ const q = work(t + rnd(1,3)*H); if(q < NOW){
        if(opt.scrap){ qc(p, 'S3', q, 'scrap', {defect:'ใยแห้ง (dry spot)', note:'ใยแห้งเป็นวงกว้างบริเวณขอบ ซ่อมไม่ได้'}); p.scrapped = true; p.scrap_reason = 'ใยแห้ง (dry spot)'; return {scrapAt:q} }
        qc(p, 'S3', q, 'pass') } }
      if(step==='S7'){ const q = work(t + rnd(0.3,2)*H); if(q < NOW){
        if(opt.rework && !reworked){ reworked = true; qc(p, 'S7', q, 'rework', {defect:'รอยขัด/ขนแมว', rework_step:'S6', note:'ยังเห็นรอยขนแมวเมื่อส่องไฟด้านข้าง'});
          for(const l of D.step_logs) if(l.piece_id===p.id && (l.step==='S6' || l.step==='S7') && l.status==='done') l.status = 'reworked';
          i = route.indexOf('S6'); t = q + rnd(0.5,2)*H; continue }
        qc(p, 'S7', q, 'pass') } return }
      t += (step==='S3' ? rnd(10,18) : step==='S1' ? rnd(1,2.5) : rnd(1.5,22)) * H;
      i++;
    }
  }
  const dayStart = (daysAgo, h=8) => { const d = new Date(NOW - daysAgo*DAY); d.setHours(h, 0, 0, 0); return d.getTime() };
  const mkOrder = (daysAgo, dueIn, customer, items, note=null) => {
    const rd = new Date(dayStart(daysAgo)), pre = 'IF' + String(rd.getFullYear()).slice(2) + pad(rd.getMonth()+1) + '-';
    const no = pre + String(D.orders.filter(o => o.order_no.startsWith(pre)).length + 1).padStart(3,'0');
    const o = {id:uid(), order_no:no, customer, received_date:localDate(rd), due_date:localDate(new Date(NOW + dueIn*DAY)), note, created_by:wSup.id, created_at:iso(Math.min(dayStart(daysAgo, 9), NOW - 40*60000))};
    D.orders.push(o); let seq = 0; const pcs = [];
    for(const [pr, qty, route] of items){
      const oi = {id:uid(), order_id:o.id, product_id:pr.id, qty, route, created_at:o.created_at}; D.order_items.push(oi);
      for(let k = 0; k < qty; k++){ seq++; const p = {id:uid(), code:`${no}-${pad(seq)}`, order_id:o.id, order_item_id:oi.id, product_id:pr.id, route, seq, scrapped:false, scrap_reason:null, replaces:null, created_at:o.created_at}; D.pieces.push(p); pcs.push([p, pr]) }
    }
    return pcs;
  };
  const o1 = mkOrder(13, -1, 'อู่เรือบางปะกง (ตัวอย่าง)', [[pBoat, 2, 'B']], 'ลูกค้าขอเจลโค้ตสีขาวเงา');
  const o2 = mkOrder(9, 4, 'ออโต้พาร์ท จำกัด (ตัวอย่าง)', [[pHood, 4, 'B']]);
  const o3 = mkOrder(6, 7, 'ร้านแต่งรถ ปทุมธานี (ตัวอย่าง)', [[pSkirt, 6, 'A']]);
  const o4 = mkOrder(1, 12, 'ลูกค้าหน้าร้าน (ตัวอย่าง)', [[pHood, 2, 'A']]);
  o1.forEach(([p, pr], i) => sim(p, pr, dayStart(12, 8) + i*1.2*DAY));
  o2.forEach(([p, pr], i) => { const r = sim(p, pr, dayStart(8, 8) + i*0.4*DAY, {scrap: i===2});
    if(r && r.scrapAt){ const np = {...p, id:uid(), code:p.code+'-R1', scrapped:false, scrap_reason:null, replaces:p.id, seq:5, created_at:iso(r.scrapAt)}; D.pieces.push(np); sim(np, pr, r.scrapAt + 0.6*DAY) } });
  o3.forEach(([p, pr], i) => sim(p, pr, dayStart(5, 8) + i*0.3*DAY, {rework: i===0}));
  o4.forEach(([p, pr], i) => sim(p, pr, dayStart(0, 9) + i*0.15*DAY));
  mkOrder(0, 14, 'อู่ซ่อมสีรถ (ตัวอย่าง)', [[pSkirt, 3, 'A']], 'ออเดอร์ใหม่วันนี้ ยังไม่เริ่มงาน');
  // ให้มีตัวอย่างงานที่ "กำลังทำ" เสมอ ไม่ว่าจะเปิดดูเวลาไหน
  const logsOf = id => D.step_logs.filter(l => l.piece_id===id);
  const nextStep = p => { const done = new Set(logsOf(p.id).filter(l => l.status==='done').map(l => l.step)); return ROUTES[p.route].find(s => !done.has(s)) };
  const candidates = D.pieces.filter(p => !p.scrapped && !logsOf(p.id).some(l => l.status==='in_progress') && nextStep(p) && nextStep(p)!=='S1');
  for(const p of candidates){
    if(D.step_logs.filter(l => l.status==='in_progress').length >= 3) break;
    const step = nextStep(p), w = SW[step].find(x => !busy[x.id]); if(!w) continue;
    busy[w.id] = 1; const t = NOW - rnd(15, 55)*60000;
    D.step_logs.push({id:uid(), piece_id:p.id, step, worker_id:w.id, finished_by:null, started_at:iso(t), finished_at:null, passes:null, materials:[], note:null, photo_url:null, status:'in_progress', created_at:iso(t)});
  }
  const rc = (code, qty, daysAgo, note) => D.stock_receipts.push({id:uid(), material_id:MAT[code], qty, unit_cost:D.materials.find(m => m.id===MAT[code]).unit_cost, kind:'receive', note, worker_id:wSup.id, created_at:iso(dayStart(daysAgo, 10))});
  [['GC-W',50],['GC-BK',20],['FB-SV',150],['FB-300',80],['FB-400',260],['FB-W600',120],['FB-W800',90],['FB-W1000',40],['RS-INF',200],['RS-GC',30],['CAT-MEKP',4],['PL-C',2],['PL-F',1.5]].forEach(([c,q]) => rc(c, q, 18, 'ยอดยกมา'));
  rc('RS-INF', 100, 4, 'ใบส่งของ DN-0458 (ตัวอย่าง)');
  return D;
}

   BOOT
   ===================================================================== */
function vLogin(msg=''){
  $('#tabs').innerHTML = ''; $('#topright').innerHTML = ''; $('#banner').innerHTML = '';
  $('#topright').innerHTML = langSwitch();
  $('#main').innerHTML = `<form class="panel login" data-form="login"><h2>${tr('login.title')}</h2>
    <p class="ink2" style="margin:0">${tr('login.body')}</p>
    <div class="field"><label for="lg-email">${tr('login.email')}</label><input id="lg-email" class="input" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lg-pass">${tr('login.pass')}</label><input id="lg-pass" class="input" type="password" autocomplete="current-password" required></div>
    ${msg ? `<div class="err" style="text-align:left">${esc(msg)}</div>` : ''}
    <button class="btn btn-primary btn-xl" type="submit">${tr('login.btn')}</button>
    <a class="btn btn-ghost" href="?demo">${tr('login.demo')}</a></form>`;
  $('#main').querySelector('form').onsubmit = async e => {
    e.preventDefault();
    const { error } = await S.sb.auth.signInWithPassword({email:$('#lg-email').value.trim(), password:$('#lg-pass').value});
    if(error) return vLogin(tr('login.fail') + ' ' + error.message);
    await afterLogin();
  };
}
async function afterLogin(){
  try {
    const { data:{ user } } = await S.sb.auth.getUser();
    const { data:prof, error } = await S.sb.from('profiles').select('role').eq('id', user.id).single();
    if(error) throw error;
    S.deviceRole = prof?.role || 'station';
    await loadAll(); render();
  } catch(e){ vLogin(tr('login.loadFail') + ' ' + errMsg(e)) }
}
async function boot(){
  document.documentElement.lang = S.lang;
  if(S.mode==='demo'){ await loadAll(); render(); return }
  try {
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js');
    S.sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
    const { data:{ session } } = await S.sb.auth.getSession();
    if(!session) return vLogin();
    await afterLogin();
  } catch(e){ $('#main').innerHTML = `<div class="empty">เชื่อมต่อ Supabase ไม่ได้: ${esc(errMsg(e))}</div>` }
}
boot();
</script>
